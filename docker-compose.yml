# DB test cho sqlctx (Postgres + Oracle) - tham số kết nối khớp ĐÚNG với run.sh, chỉ cần
# "docker compose up -d" là chạy được ngay, không cần setup tay như trước.
#
# LƯU Ý: nếu máy đang có sẵn Postgres/Oracle khác chiếm port 54329/1521 (vd cài native, hoặc
# container cũ chạy tay bằng "docker run"), phải dừng cái cũ trước khi "docker compose up",
# nếu không sẽ xung đột port.
services:
  postgres:
    image: postgres:18
    container_name: sqlctx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: naviq
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: x
    ports:
      - "54329:5432"
    # postgres:18 đổi quy ước mount: khuyến nghị mount NGUYÊN "/var/lib/postgresql" (không phải
    # ".../data" như các bản 17 trở về trước) - image tự tạo thư mục con theo version bên trong.
    # Mount nhầm ".../data" sẽ crash-loop ngay từ lần start đầu (đã tự kiểm chứng lỗi này khi test).
    volumes:
      - sqlctx_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tester -d naviq"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    # gvenzl/oracle-free: image community phổ biến nhất cho Oracle chạy trên Docker (Oracle không
    # phát hành image chính thức public) - đã dùng bản này để test Oracle trong dự án từ trước.
    image: gvenzl/oracle-free:23-slim
    container_name: sqlctx-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: Oracle123
      # APP_USER/APP_USER_PASSWORD: image tự tạo user này trong PDB mặc định (FREEPDB1) lúc khởi
      # tạo lần đầu, đúng tham số --user=/--password= run.sh đang dùng - không cần script tay.
      APP_USER: naviq
      APP_USER_PASSWORD: Naviq123
    ports:
      - "1521:1521"
    volumes:
      - sqlctx_oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.4
    container_name: sqlctx-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "Redis123", "--appendonly", "yes"]
    ports:
      - "63790:6379"
    volumes:
      - sqlctx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Redis123", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis Cluster 3 master trong 1 container (chỉ chạy khi gọi: docker compose --profile redis-cluster up -d).
  # Node tự báo địa chỉ 127.0.0.1:700x và cổng ngoài = cổng trong, nên MOVED/ASK từ máy host nối thẳng được.
  # sqlctx --dialect=redis --host=127.0.0.1 --port=7001 --password=Redis123
  redis-cluster:
    image: redis:7.4
    container_name: sqlctx-redis-cluster
    profiles: ["redis-cluster"]
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        for p in 7001 7002 7003; do
          redis-server --port $$p --cluster-enabled yes --cluster-config-file /tmp/nodes-$$p.conf \
            --cluster-announce-ip 127.0.0.1 --requirepass Redis123 --masterauth Redis123 --daemonize yes
        done
        sleep 1
        redis-cli -a Redis123 --no-auth-warning --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-yes
        exec tail -f /dev/null
    ports:
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 -a Redis123 --no-auth-warning cluster info | grep -q cluster_state:ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Master 6390 + replica 6391 + 1 sentinel 26390 theo dõi "mymaster" (docker compose --profile redis-sentinel up -d).
  # sqlctx --dialect=redis --host=127.0.0.1 --port=26390 --sentinel-master=mymaster --password=Redis123
  # Thử failover: redis-cli -p 26390 SENTINEL FAILOVER mymaster, rồi \c lại trong sqlctx.
  redis-sentinel:
    image: redis:7.4
    container_name: sqlctx-redis-sentinel
    profiles: ["redis-sentinel"]
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        redis-server --port 6390 --requirepass Redis123 --masterauth Redis123 --daemonize yes
        redis-server --port 6391 --requirepass Redis123 --masterauth Redis123 --replicaof 127.0.0.1 6390 --daemonize yes
        printf 'port 26390\nsentinel monitor mymaster 127.0.0.1 6390 1\nsentinel auth-pass mymaster Redis123\nsentinel down-after-milliseconds mymaster 3000\nsentinel failover-timeout mymaster 10000\n' > /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    ports:
      - "6390:6390"
      - "6391:6391"
      - "26390:26390"

  # Kafka 3.8 KRaft 1 node (broker + controller), không cần ZooKeeper. Máy dev có sẵn container "kafka" ở 9092
  # nên dùng 19092. Bật StandardAuthorizer để thử được kafka-acls; ANONYMOUS (PLAINTEXT) là super user nên mọi
  # thao tác khác vẫn chạy như không có ACL.
  kafka:
    image: apache/kafka:3.8.0
    container_name: sqlctx-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://sqlctx-kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@sqlctx-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    ports:
      - "19092:19092"
    volumes:
      - sqlctx_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Schema Registry cho kafka-avro-console-consumer/producer, kafka-json-schema-*, kafka-protobuf-console-consumer.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: sqlctx-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: sqlctx-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: sqlctx-kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlctx_kafka_data:
  sqlctx_redis_data:
  sqlctx_postgres_data:
  sqlctx_oracle_data:
