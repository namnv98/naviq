# Cau hinh java.util.logging cho NaviQ CLI - ghi log ra file, KHONG can JVM arg
# (duoc load thu cong qua LoggingConfig.init() trong NaviQCli.main(), xem file do).

# Chi dung FileHandler (bo ConsoleHandler mac dinh de khong lam ban terminal CLI dang chay).
handlers = java.util.logging.FileHandler

# Muc mac dinh cho moi logger khac (thu vien ben thu 3, JLine...) - giu INFO cho gon.
.level = INFO

# Rieng package com.naviq (code cua minh) - bat toi da de debug (FINE/FINER/FINEST deu duoc ghi).
com.naviq.level = ALL

# --- FileHandler ---
# %h = thu muc home cua user hien tai -> file log tai ~/naviq-debug.log
java.util.logging.FileHandler.pattern = %h/naviq-debug.log
# Gioi han 10MB/file, giu toi da 3 file xoay vong (naviq-debug.log.0, .1, .2)
java.util.logging.FileHandler.limit = 10485760
java.util.logging.FileHandler.count = 3
# append=true - moi lan chay CLI KHONG xoa log cu, noi tiep vao cuoi file
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Dinh dang 1 dong log: thoi gian - [MUC] tenLogger - noi dung
java.util.logging.SimpleFormatter.format = %1$tF %1$tT [%4$s] %3$s - %5$s%6$n
